<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매일 영어 회화</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2442e6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm pocket coach, one card at a time
   IDEA: a stack of index cards flipped on the commute
   PICTURE: the live card, big, at the top
   COLOUR and TYPE: white, cobalt #2442e6, coral #ff5a4e; Outfit + Noto Sans KR
   LAYOUT: single phone column, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1024);--ink:light-dark(#11152b,#eef0ff);--mute:light-dark(#5d6380,#a3a9c9);--line:light-dark(#e3e6f2,#262b4a);--card:light-dark(#f4f6ff,#171c3a);--blue:#2442e6;--blue2:light-dark(#dfe5ff,#25306e);--coral:#ff5a4e;--ok:#12996b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.en{font-family:Outfit,"Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:700 24px/1.1 Outfit,"Noto Sans KR",sans-serif;margin:0}
h2{font-size:18px;margin:22px 0 10px}
.streak{background:var(--blue);color:#fff;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:10px 16px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.primary{background:var(--blue);color:#fff;font-weight:700}
.big{width:100%;font-size:18px;min-height:56px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{background:none;min-height:40px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.12)}
:root[data-theme=dark] .seg button.on{color:#8fa2ff}
.hero{background:var(--blue);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .n{font:700 clamp(40px,12vw,56px)/1 Outfit,sans-serif}
.hero .row{display:flex;gap:18px;margin:12px 0 18px;flex-wrap:wrap}
.hero .row div{font-size:14px;opacity:.9}
.hero .row b{display:block;font:700 26px/1.1 Outfit,sans-serif;opacity:1}
.hero button{background:#fff;color:var(--blue)}
.prog{font-size:14px;opacity:.9;margin-top:10px}
.stage{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:320px;padding:46px 22px 26px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;box-shadow:0 10px 0 -4px var(--blue2)}
.tag{position:absolute;top:14px;left:18px;font-size:13px;color:var(--mute);right:70px}
.cnt{position:absolute;top:14px;right:18px;font-size:13px;color:var(--mute)}
.front{font:700 clamp(28px,9vw,42px)/1.15 Outfit,"Noto Sans KR",sans-serif;text-wrap:balance}
.front.ko{font-family:"Noto Sans KR",sans-serif;font-size:clamp(22px,6.5vw,28px)}
.sent{font:600 clamp(22px,6.5vw,30px)/1.35 Outfit,"Noto Sans KR",sans-serif}
.ko-s{font-size:17px;color:var(--mute);font-weight:500}
.back{border-top:2px dashed var(--line);padding-top:12px;display:grid;gap:6px}
.back .main{font-size:20px;font-weight:700}
.spk{display:inline-flex;align-items:center;gap:6px;background:var(--blue2);color:var(--ink);padding:8px 14px;min-height:40px;font-size:15px;width:max-content}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate button{font-weight:700}
.r0{background:#ffe2df;color:#a32116}.r1{background:#fff1c9;color:#7a5600}.r2{background:#d8f5e8;color:#0b6b4b}
.hint{font-size:14px;color:var(--mute);text-align:center;margin:0}
.lt{text-align:left}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.quit{min-height:40px;padding:6px 14px;font-size:15px;background:none;border:1px solid var(--line);color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s}
.blur{filter:blur(7px);background:var(--blue2);border-radius:8px;padding:0 4px;cursor:pointer;user-select:none;transition:filter .3s}
.blur.open{filter:none;background:#ffe9a8;color:#11152b}
.hintbox{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:16px}
.mic{background:var(--coral);color:#fff;font-weight:700}.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.ans{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ans input,input[type=search],select{font:inherit;font-size:16px;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px}
.ghost{background:none;color:var(--mute);text-decoration:underline;justify-self:center}
.verdict{font-size:22px;font-weight:700}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--coral)}
.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.list li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.list .k{color:var(--mute);font-size:14px;grid-column:1}
.list .w{font:600 18px/1.3 Outfit,"Noto Sans KR",sans-serif}
.list .mini{min-height:40px;padding:6px 12px;grid-row:1/span 2;grid-column:2}
.badge{display:inline-block;font:500 12px "Noto Sans KR",sans-serif;padding:1px 8px;border-radius:99px;background:var(--blue2);color:var(--ink);margin-left:6px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
mark{background:#ffe9a8;color:#11152b;border-radius:4px;padding:0 2px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:8px}
summary{cursor:pointer;padding:10px 0;font:600 18px/1.3 Outfit,"Noto Sans KR",sans-serif}
summary small{display:block;font:400 14px "Noto Sans KR",sans-serif;color:var(--mute)}
.ex-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ex-row .k{font-size:14px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font:700 30px/1.1 Outfit,sans-serif}
.stat span{font-size:14px;color:var(--mute)}
.set{display:grid;gap:12px;margin-top:8px}
.set label{display:grid;gap:4px;font-size:15px}
textarea{width:100%;min-height:90px;font:14px/1.4 monospace;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border-radius:12px;font-size:13px;padding:6px 2px;display:grid;justify-items:center;gap:2px;color:var(--mute)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--blue);font-weight:700}
:root[data-theme=dark] nav button.on{color:#8fa2ff}
.done{text-align:center;padding:30px 10px}
.done .n{font:700 64px/1 Outfit,sans-serif;color:var(--blue)}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;max-height:252px;overflow-y:auto;padding:3px}
.chg button{min-height:44px;padding:4px;font:700 15px Outfit,sans-serif;border:1px solid var(--line)}
.chg .n{background:var(--bg)}.chg .p{background:var(--blue2)}.chg .d{background:var(--blue);color:#fff}.chg .m{background:var(--ok);color:#fff}
.chg .sel{outline:3px solid var(--coral);outline-offset:1px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 8px}.lg.n{background:var(--bg)}.lg.p{background:var(--blue2)}.lg.d{background:var(--blue)}.lg.m{background:var(--ok)}
.chpanel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px;scroll-margin-top:12px}
.chhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:center;margin-bottom:12px}
.chhead .k{font-size:14px;color:var(--mute)}
.nav2{background:var(--bg);border:1px solid var(--line);min-width:48px}
.chpanel .list li{background:var(--bg)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
@media (prefers-reduced-motion:no-preference){.card.flip{animation:pop .25s ease}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>매일 영어 회화</h1><span class="streak" id="streak">🔥 0일</span></header>
  <main id="view"><p class="hint">불러오는 중…</p></main>
</div>
<nav id="nav">
  <button data-t="conv" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>회화</button>
  <button data-t="voc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>단어</button>
  <button data-t="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>검색</button>
  <button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>기록</button>
</nav>
<script src="data.js"></script>
<script>
{
const VERSION='v2.1';
// ---------- ITEMS ----------
// t: z = 문장 속 가려진 표현 맞히기, s = 한국어 보고 문장 말하기, v = 단어
const D=window.DATA||{conv:[],voc:[]};
const items=[...D.conv.map(x=>({...x,cat:'c'})),...D.voc.map(([en,ko,lv])=>({id:'v:'+en,t:'v',cat:'v',lv,en,ko}))];
const byId=Object.fromEntries(items.map(x=>[x.id,x]));
const LV={m:'중급',a:'고급'};
// 회화 학습 순서: 유형별로 섞어서(라운드 로빈) 지루하지 않게
function interleave(lists){const out=[];let i=0,more=true;while(more){more=false;for(const l of lists){if(i<l.length){out.push(l[i]);more=true}}i++}return out}
const ORDER={};
for(const lv of ['m','a']){
  const c=items.filter(x=>x.cat==='c'&&x.lv===lv);
  ORDER['c'+lv]=interleave([c.filter(x=>x.id[0]==='w'),c.filter(x=>x.id[0]==='c'),c.filter(x=>x.id[0]==='p'),c.filter(x=>x.id[0]==='s')]);
  ORDER['v'+lv]=items.filter(x=>x.cat==='v'&&x.lv===lv);
}

// ---------- 장(챕터) ----------
const CH={c:10,v:20};
function chapters(cat,lv){const l=ORDER[cat+lv],n=CH[cat],out=[];for(let i=0;i<l.length;i+=n)out.push(l.slice(i,i+n));return out}
function chStat(l){const s=l.filter(x=>S.srs[x.id]).length,m=l.filter(x=>S.srs[x.id]&&S.srs[x.id].b>=3).length;return m===l.length?'m':s===l.length?'d':s?'p':'n'}

// ---------- STATE ----------
const KEY='engapp_v1';
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/86400000)};
let S={srs:{},days:{},wrong:{},hist:[],set:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.set=Object.assign({newC:10,newV:20,rate:0.9,dir:'ek',lvC:'m',lvV:'m'},S.set);
if(S.set.newW&&!S.set._mig){S.set.newC=S.set.newW;S.set._mig=1}
const curCh=(cat,lv)=>{const k='ch'+cat+lv,chs=chapters(cat,lv);if(!S.set[k]){const i=chs.findIndex(l=>l.some(x=>!S.srs[x.id]));S.set[k]=i<0?1:i+1}return Math.min(S.set[k],chs.length)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const IV=[0,1,3,7,14,30,60];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- CLOZE ----------
const IRR={run:'run|ran|running|runs',forget:'forget|forgot|forgotten',take:'take|took|taken|taking|takes',come:'come|came|coming|comes',bring:'bring|brought|bringing',get:'get|got|getting|gets',go:'go|went|going|goes|gone',hold:'hold|held|holding',make:'make|made|making|makes',mean:'mean|meant|means',be:'be|am|are|is|was|were|been',give:'give|gave|given|giving'};
const FIX=['i','a','the','to','of','for','on','in','by','as','it','up','out','off','into','with','back','over','that','not','no','same','page','sure','possible','soon','far','now','person','track','schedule','way','bit','little','try','look','good','depends','worries','sense'];
function phraseRx(ph){const t=ph.replace(/~/g,'').trim().split(/\s+/).map(w=>{w=w.toLowerCase().replace(/[^a-z'-]/g,'');if(IRR[w])return '(?:'+IRR[w]+')';if(FIX.includes(w))return w.replace(/[-']/g,'\\$&');return w.replace(/e$/,'').replace(/y$/,'(?:y|i)')+'[a-z]*'});return new RegExp('\\b'+t.join('\\s+')+'\\b','i')}
const plainEx=x=>x.ex.replace(/[\[\]]/g,'');
function cloze(x){
  const ex=x.ex;let html;
  if(ex.includes('[')) html=esc(ex).replace(/\[(.+?)\]/g,'<span class="blur">$1</span>');
  else{const m=ex.match(phraseRx(x.en));html=m?esc(ex.slice(0,m.index))+'<span class="blur">'+esc(m[0])+'</span>'+esc(ex.slice(m.index+m[0].length)):esc(ex)+' <span class="blur">'+esc(x.en)+'</span>'}
  return {html,plain:plainEx(x)};
}
const norm=t=>String(t).toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const answerOf=x=>{if(x.t==='v')return x.en;if(x.ex.includes('['))return [...x.ex.matchAll(/\[(.+?)\]/g)].map(m=>m[1]).join(' ');const m=x.ex.match(phraseRx(x.en));return m?m[0]:x.en};
function isRight(x,said){const a=norm(answerOf(x)),b=' '+norm(said)+' ';return a.length>0&&b.includes(' '+a+' ')}

// ---------- SPEECH ----------
let voice=null;
const pickVoice=()=>{try{const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));voice=v.find(v=>v.name===S.set.voice)||v.find(v=>/en-US/i.test(v.lang)&&/Google|Samsung|Natural/i.test(v.name))||v.find(v=>/en-US/i.test(v.lang))||v[0]||null}catch(e){}};
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/~/g,'something'));u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.65:S.set.rate;speechSynthesis.speak(u)}catch(e){}}

// ---------- STATS / SRS ----------
function logDay(n){const t=today();S.days[t]=(S.days[t]||0)+n;save()}
function streak(){let t=today(),n=0;if(!S.days[t])t--;while(S.days[t]){n++;t--}return n}
const setStreak=()=>document.getElementById('streak').textContent='🔥 '+streak()+'일';
function intro(){const t=today();if(!S.intro||S.intro.d!==t||typeof S.intro.w==='number')S.intro={d:t};return S.intro}
const dueOf=(cat,lv)=>{const t=today();return items.filter(x=>x.cat===cat&&x.lv===lv&&S.srs[x.id]&&S.srs[x.id].d<=t)};
const newOf=(cat,lv)=>{const lim=cat==='c'?S.set.newC:S.set.newV,k=cat+lv;return ORDER[k].filter(x=>!S.srs[x.id]).slice(0,Math.max(0,lim-(intro()[k]||0)))};
const seenOf=(cat,lv)=>ORDER[cat+lv].filter(x=>S.srs[x.id]).length;
function markWrong(id){const w=S.wrong[id]||{n:0,ok:0};w.n++;w.ok=0;w.d=today();S.wrong[id]=w;save()}
function markRight(id){const w=S.wrong[id];if(w){w.ok++;if(w.ok>=2)delete S.wrong[id];save()}}
const wrongItems=cat=>Object.keys(S.wrong).filter(i=>byId[i]&&(!cat||byId[i].cat===cat)).sort((a,b)=>S.wrong[b].n-S.wrong[a].n).map(i=>byId[i]);

// ---------- SESSION ----------
let Q=[],qi=0,shown=false,total=0,done=0,again=new Set(),res=null,rec=null,quit=false,sess=null,back='conv';
function startSession(list,label,from){if(!list.length)return;quit=false;back=from||tab;sess={label:label||'학습',t0:Date.now(),ok:0,ng:0,ids:[]};Q=list.map(x=>x.id);qi=0;shown=false;res=null;total=Q.length;done=0;again=new Set();renderCard()}
function startToday(cat){const lv=cat==='c'?S.set.lvC:S.set.lvV;startSession([...dueOf(cat,lv).slice(0,cat==='c'?40:60),...newOf(cat,lv)],(cat==='c'?'회화 ':'단어 ')+LV[lv]+' 오늘 학습',cat==='c'?'conv':'voc')}
function rate(r){
  const id=Q[qi],t=today(),cur=S.srs[id]||{b:0,d:t},x=byId[id];
  if(!S.srs[id]){const I=intro(),k=x.cat+x.lv;I[k]=(I[k]||0)+1}
  if(r===0){cur.b=0;cur.d=t;markWrong(id);if(!again.has(id)){again.add(id);Q.push(id);total++}}
  else if(r===1){cur.b=Math.max(1,cur.b);cur.d=t+1}
  else{cur.b=Math.min(cur.b+1,IV.length-1);cur.d=t+IV[cur.b];markRight(id)}
  if(sess){if(r===0)sess.ng++;else sess.ok++;if(!sess.ids.includes(id))sess.ids.push(id)}
  S.srs[id]=cur;done++;logDay(1);setStreak();qi++;shown=false;res=null;renderCard();
}
function listen(x,v){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,msg=v.querySelector('#mmsg');
  if(!SR){msg.textContent='이 화면에서는 마이크를 쓸 수 없어요. 아래 칸에 입력해 주세요.';return}
  try{rec&&rec.abort()}catch(e){}
  rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
  const mb=v.querySelector('#mic');mb.classList.add('live');msg.textContent='듣고 있어요… 말해 보세요';
  rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);check(x,alts.find(a=>isRight(x,a))||alts[0])};
  rec.onerror=e=>{mb.classList.remove('live');msg.textContent=/not-allowed/.test(e.error)?'마이크 권한이 없어요. 아래 칸에 입력해 주세요.':'잘 안 들렸어요. 다시 눌러 주세요.'};
  rec.onend=()=>mb.classList.remove('live');
  try{rec.start()}catch(e){msg.textContent='마이크를 시작할 수 없어요. 입력해 주세요.'}
}
function check(x,said){res={ok:isRight(x,said),said:said||'(모름)'};shown=true;renderCard();say(x.t==='z'?plainEx(x):x.en)}
const answerBox=`<button class="mic big" id="mic">🎤 말해서 확인</button>
  <form id="tf" class="ans"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="또는 입력하기" aria-label="답 입력"><button class="primary">확인</button></form>
  <p class="hint" id="mmsg"></p><button class="ghost" id="dk">모르겠어요</button>`;
const afterCheck=()=>res&&res.ok?`<div class="rate" style="grid-template-columns:1fr 2fr"><button class="r1" data-r="1">헷갈렸어요</button><button class="r2" data-r="2">다음 →</button></div>`
  :`<button class="primary big" data-r="0">오답 노트에 기록하고 다음 →</button><button class="ghost" data-r="2">사실 맞게 말했어요</button>`;
const verdict=()=>res?`<div class="verdict ${res.ok?'ok':'no'}">${res.ok?'✅ 정답!':'❌ 다시 외워요'}</div><div class="hint lt">내 답: <span class="en">${esc(res.said)}</span></div>`:'';

function renderCard(){
  const v=document.getElementById('view');
  if(qi>=Q.length){
    if(sess&&done>0){S.hist.unshift({t:sess.t0,l:sess.label,n:done,u:sess.ids.length,ok:sess.ok,ng:sess.ng,m:Math.max(1,Math.round((Date.now()-sess.t0)/60000)),q:quit?1:0});S.hist=S.hist.slice(0,1000);save()}sess=null;
    const wn=Object.keys(S.wrong).length;
    v.innerHTML=`<div class="done"><div class="n">${done}</div><p>${quit?'개 학습했어요. 진행한 내용은 저장됐고, 남은 카드는 다음에 이어서 나와요.':'개 학습 완료!'} 연속 <b>${streak()}일</b> 째예요.</p>${wn?`<p class="hint">오답 노트에 ${wn}개가 있어요.</p><button class="big" id="wr" style="margin:10px 0">오답만 다시 풀기</button>`:''}<button class="primary big" id="home">처음으로</button></div>`;
    v.querySelector('#home').onclick=()=>go(back);const wr=v.querySelector('#wr');if(wr)wr.onclick=()=>startSession(wrongItems(),'오답 다시 풀기',back);
    setStreak();return;
  }
  const x=byId[Q[qi]],isNew=!S.srs[x.id],wc=S.wrong[x.id];
  const kind=x.t==='z'?'가려진 표현 맞히기':x.t==='s'?'영어로 말해 보기':(S.set.dir==='ek'?'단어 · 뜻 떠올리기':'단어 · 영어로 말하기');
  const tag=`${x.cat==='c'?'회화':'단어'} ${LV[x.lv]} · ${kind}${isNew?' · <b style="color:var(--coral)">NEW</b>':''}${wc?` · <b style="color:var(--coral)">오답 ${wc.n}회</b>`:''}`;
  let inner,ctl;
  if(x.t==='z'){
    const cz=cloze(x);
    inner=`<div class="ko-s">${esc(x.exko)}</div><div class="sent en">${shown?cz.html.replace(/class="blur"/g,'class="blur open"'):cz.html}</div>`+
      (shown?`<div class="back">${verdict()}<div class="main"><span class="en">${esc(x.en)}</span> — ${esc(x.ko)}</div><div class="row2"><button class="spk" data-s="${esc(cz.plain)}">🔊 문장 듣기</button><button class="spk" data-slow="1" data-s="${esc(cz.plain)}">🐢 천천히</button></div></div>`
            :`<div class="row2"><button class="spk" id="h1">💡 표현 뜻</button><button class="spk" data-s="${esc(cz.plain)}">🎧 듣고 맞히기</button></div><div id="hb"></div>`);
    ctl=shown?afterCheck():answerBox;
  }else if(x.t==='s'){
    inner=`${x.pat?`<div class="hint lt">패턴: <span class="en">${esc(x.pat)}</span> · ${esc(x.patko)}</div>`:`<div class="hint lt">상황: ${esc(x.tp)}</div>`}<div class="front ko">${esc(x.ko)}</div>`+
      (shown?`<div class="back"><div class="main en">${esc(x.en)}</div><div class="row2"><button class="spk" data-s="${esc(x.en)}">🔊 보통</button><button class="spk" data-slow="1" data-s="${esc(x.en)}">🐢 천천히</button></div><div class="hint lt">들은 뒤 3번 소리 내어 따라 말해 보세요.</div></div>`:'');
    ctl=shown?`<div class="rate"><button class="r0" data-r="0">모름</button><button class="r1" data-r="1">애매</button><button class="r2" data-r="2">앎</button></div><p class="hint">모름은 오답 노트에 기록돼요.</p>`
             :`<button class="primary big" id="show">정답 보기</button><p class="hint">먼저 영어로 소리 내어 말해 보세요</p>`;
  }else if(S.set.dir==='ek'){
    inner=`<div class="front en">${esc(x.en)}</div><button class="spk" data-s="${esc(x.en)}">🔊 발음 듣기</button>`+
      (shown?`<div class="back"><div class="main">${esc(x.ko)}</div></div>`:'');
    ctl=shown?`<div class="rate"><button class="r0" data-r="0">모름</button><button class="r1" data-r="1">애매</button><button class="r2" data-r="2">앎</button></div>`
             :`<button class="primary big" id="show">뜻 보기</button><p class="hint">뜻을 먼저 떠올려 보세요</p>`;
  }else{
    inner=`<div class="front ko">${esc(x.ko)}</div><div class="hint lt">첫 글자: <b class="en">${esc(x.en[0])}</b> · ${x.en.length}글자</div>`+
      (shown?`<div class="back">${verdict()}<div class="main en">${esc(x.en)}</div><button class="spk" data-s="${esc(x.en)}">🔊 발음 듣기</button></div>`:'');
    ctl=shown?afterCheck():answerBox;
  }
  v.innerHTML=`<div class="stage"><div class="top"><div class="bar"><i style="width:${Math.round(qi/Math.max(total,1)*100)}%"></i></div><button class="quit" id="quit" aria-label="학습 종료">✕ 종료</button></div>
    <div class="card flip"><span class="tag">${tag}</span><span class="cnt">${qi+1} / ${total}</span>${inner}</div>${ctl}</div>`;
  v.querySelectorAll('.spk[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s,b.dataset.slow));
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
  v.querySelector('#quit').onclick=()=>{try{rec&&rec.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}quit=true;qi=Q.length;renderCard()};
  const sb=v.querySelector('#show');if(sb)sb.onclick=()=>{shown=true;renderCard();say(x.en)};
  const h1=v.querySelector('#h1');if(h1)h1.onclick=()=>{v.querySelector('#hb').innerHTML=`<div class="hintbox">표현 뜻: <b>${esc(x.ko)}</b></div>`;h1.remove()};
  const mic=v.querySelector('#mic');if(mic)mic.onclick=()=>listen(x,v);
  const tf=v.querySelector('#tf');if(tf)tf.onsubmit=e=>{e.preventDefault();const t=v.querySelector('#ti').value.trim();if(t)check(x,t)};
  const dk=v.querySelector('#dk');if(dk)dk.onclick=()=>check(x,'');
  if(!shown&&x.t==='z')v.querySelectorAll('.blur').forEach(b=>b.onclick=()=>check(x,''));
}

const seg=(k,cur)=>`<div class="seg">${['m','a'].map(l=>`<button data-lv="${k}:${l}" class="${cur===l?'on':''}">${LV[l]}</button>`).join('')}</div>`;
function hero(cat){
  const lv=cat==='c'?S.set.lvC:S.set.lvV,due=Math.min(cat==='c'?40:60,dueOf(cat,lv).length),nw=newOf(cat,lv).length,cnt=due+nw,all=ORDER[cat+lv].length,seen=seenOf(cat,lv);
  return `<section class="hero"><div style="font-size:15px;opacity:.9">${cat==='c'?'회화':'단어'} ${LV[lv]} · 오늘 학습할 카드</div><div class="n">${cnt}개</div>
  <div class="row"><div><b>${due}</b>복습</div><div><b>${nw}</b>새 ${cat==='c'?'문장':'단어'}</div></div>

  <div class="chg">${chs.map((l,i)=>`<button class="${chStat(l)}${i+1===cur?' sel':''}" data-ch="${cat}:${i+1}" aria-label="${i+1}장">${i+1}</button>`).join('')}</div>
  <div id="chp-${cat}"></div>`;
}
function chPanel(v,cat){
  const lv=cat==='c'?S.set.lvC:S.set.lvV,chs=chapters(cat,lv),n=curCh(cat,lv),l=chs[n-1],box=v.querySelector('#chp-'+cat);if(!box||!l)return;
  const st=l.filter(x=>S.srs[x.id]).length,first=(n-1)*CH[cat]+1;
  box.innerHTML=`<div class="chpanel"><div class="chhead"><button class="nav2" data-chmv="-1" ${n<=1?'disabled':''} aria-label="이전 장">◀</button><div><b class="en" style="font-size:22px">${n}장</b><div class="k">${cat==='v'?`${first}~${first+l.length-1}번 단어 · `:''}${l.length}개 중 ${st}개 학습</div></div><button class="nav2" data-chmv="1" ${n>=chs.length?'disabled':''} aria-label="다음 장">▶</button></div>
   <button class="primary big" data-chgo="${cat}">${n}장 학습하기 (${l.length}개)</button>
   ${st?`<button class="big" data-chweak="${cat}" style="margin-top:8px">${n}장에서 아직 못 익힌 것만</button>`:''}

  bindSpk(box);

  box.querySelector('[data-chgo]').onclick=()=>startSession(l,`${cat==='c'?'회화':'단어'} ${LV[lv]} ${n}장`,cat==='c'?'conv':'voc');
  const wk=box.querySelector('[data-chweak]');if(wk)wk.onclick=()=>{const w=l.filter(x=>!S.srs[x.id]||S.srs[x.id].b<3);if(w.length)startSession(w,`${cat==='c'?'회화':'단어'} ${LV[lv]} ${n}장 (못 익힌 것)`,cat==='c'?'conv':'voc');else{wk.textContent='이 장은 모두 익혔어요 🎉';wk.disabled=true}};

function wrongBtn(cat){const n=wrongItems(cat).length;return n?`<h2>오답 노트</h2><button class="big" data-wrong="${cat}" style="background:#ffe2df;color:#a32116;font-weight:700">틀린 ${n}개 다시 풀기</button>`:''}
function vConv(){
  const lv=S.set.lvC,pats=[...new Set(items.filter(x=>x.cat==='c'&&x.lv===lv&&x.pat).map(x=>x.pat))],tps=[...new Set(items.filter(x=>x.cat==='c'&&x.lv===lv&&!x.pat).map(x=>x.tp))];

  (pats.length?`<h2>회화 패턴 ${pats.length}개</h2>`+pats.map(p=>{const l=items.filter(x=>x.pat===p);return `<details><summary class="en">${esc(p)}<small>${esc(l[0].patko)}</small></summary>

    <p><button class="primary" data-set="pat:${esc(p)}" style="width:100%">이 패턴 말하기 연습</button></p></details>`}).join(''):'');

let vShown=0;
function moreWords(v){const lv=S.set.lvV,l=ORDER['v'+lv],ul=v.querySelector('#vl');const next=l.slice(vShown,vShown+100);
  ul.insertAdjacentHTML('beforeend',next.map(rowHtml).join(''));vShown+=next.length;bindSpk(ul);if(vShown>=l.length)v.querySelector('#more').remove()}
function dotOf(x){const s=S.srs[x.id];return s?`<span class="dot" style="background:${s.b>=3?'var(--ok)':'var(--coral)'}"></span>`:''}
function hl(t,q){t=esc(t);if(!q)return t;const i=t.toLowerCase().indexOf(esc(q).toLowerCase());return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length)}
function rowHtml(x,q){const en=x.t==='z'?plainEx(x):x.en,ko=x.t==='z'?x.exko:x.ko;
  const extra=x.t==='z'?` <span class="k">· 핵심: ${hl(x.en,q)} = ${hl(x.ko,q)}</span>`:'';

let fq='',fres=[];
function vFind(){
  return `<input type="search" id="fq" placeholder="영어 또는 한국어로 검색 (예: meeting, 회의)" value="${esc(fq)}" aria-label="검색">

  <div id="fact"></div><ul class="list" id="fl"></ul>`;

function runFind(v){
  const q=fq.trim().toLowerCase(),ul=v.querySelector('#fl'),msg=v.querySelector('#fmsg'),act=v.querySelector('#fact');
  if(!q){ul.innerHTML='';act.innerHTML='';msg.textContent=`전체 ${items.length.toLocaleString()}개에서 찾아요.`;return}
  const score=x=>{const en=(x.t==='z'?plainEx(x)+' '+x.en:x.en).toLowerCase(),ko=(x.t==='z'?x.exko+' '+x.ko:x.ko+' '+(x.patko||'')).toLowerCase();
    if(x.en.toLowerCase()===q)return 0;if(new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(en))return 1;if(en.includes(q))return 2;if(ko.includes(q))return 3;return -1};
  fres=items.map(x=>[score(x),x]).filter(a=>a[0]>=0).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
  msg.textContent=fres.length?`${fres.length}개 찾았어요${fres.length>200?' (앞의 200개만 표시)':''}.`:'찾는 단어나 문장이 없어요.';
  act.innerHTML=fres.length?`<button class="primary" id="fstudy" style="width:100%;margin-bottom:10px">검색 결과 ${Math.min(fres.length,30)}개 바로 연습하기</button>`:'';

const WD='일월화수목금토',p2=n=>String(n).padStart(2,'0');
let showAllHist=false;

  const H=S.hist||[];if(!H.length)return '<p class="hint lt">아직 기록이 없어요. 학습을 마치거나 종료하면 여기에 남아요.</p>';
  const tot=H.reduce((a,h)=>({n:a.n+h.n,m:a.m+h.m,ok:a.ok+h.ok,ng:a.ng+h.ng}),{n:0,m:0,ok:0,ng:0});
  const groups={};H.forEach(h=>{const d=new Date(h.t),k=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`;(groups[k]=groups[k]||[]).push(h)});
  const keys=Object.keys(groups);

   keys.slice(0,showAllHist?9999:7).map((k,i)=>{const hs=groups[k];return `<details ${i===0?'open':''}><summary>${esc(k)}<small>${hs.length}회 · ${hs.reduce((a,h)=>a+h.n,0)}개 · ${hs.reduce((a,h)=>a+h.m,0)}분</small></summary>
     ${hs.map(h=>{const d=new Date(h.t);return `<div class="ex-row"><span>${p2(d.getHours())}:${p2(d.getMinutes())} · <b>${esc(h.l)}</b>${h.q?' <span class="k">(중간 종료)</span>':''}</span><span class="k" style="grid-row:1/span 2;grid-column:2;text-align:right">${h.m}분</span><span class="k">${h.n}개 · 정답 ${h.ok} · 오답 ${h.ng}</span></div>`}).join('')}</details>`}).join('')+
   (keys.length>7&&!showAllHist?'<button id="allh" style="width:100%">이전 기록 모두 보기</button>':'');
}
function vStats(){

  const last=[...Array(14)].map((_,i)=>t-13+i),mx=Math.max(10,...last.map(d=>S.days[d]||0));

  const W=wrongItems();
  return `<div class="stats"><div class="stat"><b>${streak()}일</b><span>연속 학습</span></div><div class="stat"><b>${S.days[t]||0}</b><span>오늘 푼 카드</span></div>
  <div class="stat"><b>${ids.length}</b><span>학습한 카드 / ${items.length.toLocaleString()}</span></div><div class="stat"><b>${mast}</b><span>익힌 카드 (7일 이상 간격)</span></div></div>
  <h2>진도</h2>${pr('c','m')}${pr('c','a')}${pr('v','m')}${pr('v','a')}
  <h2>최근 14일</h2><div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:110px">${last.map(d=>`<div title="${S.days[d]||0}" style="background:${d===t?'var(--coral)':'var(--blue)'};opacity:${S.days[d]?1:.15};height:${Math.max(4,(S.days[d]||0)/mx*100)}%;border-radius:4px"></div>`).join('')}</div>
  <h2>학습 이력</h2>${histHtml()}
  <h2>오답 노트 (${W.length})</h2>${W.length?`<ul class="list">${W.slice(0,100).map(x=>`<li><span class="w en">${esc(x.t==='z'?x.en:x.en)}<span class="badge">${x.cat==='c'?'회화':'단어'}</span></span><span class="k">${esc(x.ko)} · 틀린 횟수 ${S.wrong[x.id].n} · 연속 정답 ${S.wrong[x.id].ok}/2</span><button class="mini spk" data-s="${esc(x.t==='z'?plainEx(x):x.en)}" aria-label="듣기">🔊</button></li>`).join('')}</ul>`:'<p class="hint lt">아직 틀린 카드가 없어요.</p>'}
  <h2>설정</h2><div class="set">
  <label>회화: 하루 새 문장 수<select id="nc">${[5,10,15,20].map(n=>`<option ${S.set.newC==n?'selected':''}>${n}</option>`).join('')}</select></label>
  <label>단어: 하루 새 단어 수<select id="nv">${[10,20,30,50].map(n=>`<option ${S.set.newV==n?'selected':''}>${n}</option>`).join('')}</select></label>
  <label>읽기 속도<select id="rt">${[[0.75,'느리게'],[0.9,'조금 느리게'],[1,'보통']].map(([r,l])=>`<option value="${r}" ${S.set.rate==r?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>목소리<select id="vc"><option value="">자동 선택</option>${(()=>{try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).map(v=>`<option ${S.set.voice===v.name?'selected':''}>${esc(v.name)}</option>`).join('')}catch(e){return ''}})()}</select></label>
  <button id="test" class="spk">🔊 음성 테스트</button>
  <button id="reset" style="color:var(--coral)">학습 기록 초기화</button></div>
  <h2>기록 백업 · 옮기기</h2><p class="hint lt">다른 기기로 옮길 때: 복사한 코드를 새 곳의 칸에 붙여넣고 가져오기를 누르세요.</p>
  <div class="set"><button id="exp">백업 코드 복사</button><textarea id="imp" placeholder="백업 코드를 여기에 붙여넣기" aria-label="백업 코드"></textarea><button id="impb" class="primary">가져오기</button><p class="hint lt" id="bmsg"></p></div>
  <p class="note">수록: 회화 문장 ${items.filter(x=>x.cat==='c').length}개 (중급 ${ORDER.cm.length} · 고급 ${ORDER.ca.length}) · 단어 ${items.filter(x=>x.cat==='v').length.toLocaleString()}개 (중급 ${ORDER.vm.length} · 고급 ${ORDER.va.length})<br>단어는 영어 사용 빈도 순위(wordfreq 데이터) 기준으로 골랐어요.<br>버전 ${VERSION} · 학습 기록은 이 휴대폰의 브라우저에만 저장돼요.</p>`;
}
function bindSpk(root){root.querySelectorAll('.spk[data-s]').forEach(b=>b.onclick=e=>{e.preventDefault();say(b.dataset.s)})}

let tab='conv';
function go(t){
  tab=t;try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const v=document.getElementById('view');
  v.innerHTML={conv:vConv,voc:vVoc,find:vFind,stats:vStats}[t]();setStreak();bindSpk(v);
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>startToday(b.dataset.go));
  v.querySelectorAll('[data-wrong]').forEach(b=>b.onclick=()=>startSession(wrongItems(b.dataset.wrong),'오답 다시 풀기',t));
  v.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const [k,l]=b.dataset.lv.split(':');S.set[k==='C'?'lvC':'lvV']=l;save();go(t)});
  v.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{S.set.dir=b.dataset.dir;save();go(t)});
  v.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [k,val]=b.dataset.set.split(/:(.*)/s);const lv=S.set.lvC;
    startSession(items.filter(x=>x.cat==='c'&&x.lv===lv&&(k==='pat'?x.pat===val:(!x.pat&&x.tp===val))),(k==='pat'?'패턴: ':'주제: ')+val,'conv')});
  if(t==='conv'||t==='voc'){const cat=t==='conv'?'c':'v';chPanel(v,cat);v.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const [c,n]=b.dataset.ch.split(':');const lv=c==='c'?S.set.lvC:S.set.lvV;S.set['ch'+c+lv]=+n;save();v.querySelectorAll('[data-ch]').forEach(x=>x.classList.toggle('sel',x===b));chPanel(v,c);v.querySelector('#chp-'+c).scrollIntoView({behavior:'smooth',block:'start'})})}
  if(t==='find'){const q=v.querySelector('#fq');let tm;q.oninput=()=>{fq=q.value;clearTimeout(tm);tm=setTimeout(()=>runFind(v),200)};runFind(v);setTimeout(()=>q.focus(),50)}
  const sel=(id,k,f)=>{const e=v.querySelector('#'+id);if(e)e.onchange=()=>{S.set[k]=f(e.value);save();if(k==='voice')pickVoice()}};
  sel('nc','newC',Number);sel('nv','newV',Number);sel('rt','rate',Number);sel('vc','voice',String);
  const ts=v.querySelector('#test');if(ts)ts.onclick=()=>say('Hi, how is it going? Let\'s practice English together.');
  const rs=v.querySelector('#reset');if(rs)rs.onclick=()=>{if(rs.dataset.c){S.srs={};S.days={};S.wrong={};S.hist=[];S.intro=null;save();go('stats')}else{rs.dataset.c=1;rs.textContent='한 번 더 누르면 초기화돼요'}};
  const ah=v.querySelector('#allh');if(ah)ah.onclick=()=>{showAllHist=true;go('stats')};
  const ex=v.querySelector('#exp'),msg=v.querySelector('#bmsg');
  if(ex)ex.onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify({srs:S.srs,days:S.days,wrong:S.wrong,hist:S.hist}))));try{await navigator.clipboard.writeText(code);msg.textContent='복사됐어요. 메모나 카톡에 붙여넣어 보관하세요.'}catch(e){v.querySelector('#imp').value=code;msg.textContent='자동 복사가 안 돼서 위 칸에 넣었어요. 길게 눌러 복사하세요.'}};
  const ib=v.querySelector('#impb');if(ib)ib.onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(v.querySelector('#imp').value.trim()))));if(!d.srs)throw 0;S.srs=d.srs;S.days=d.days||{};S.wrong=d.wrong||{};S.hist=d.hist||[];save();go('stats');document.getElementById('bmsg').textContent='가져오기 완료!'}catch(e){msg.textContent='코드가 올바르지 않아요.'}};
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
if(!items.length)document.getElementById('view').innerHTML='<p class="hint">데이터 파일(data.js)을 불러오지 못했어요. GitHub에 data.js가 올라가 있는지 확인해 주세요.</p>';
else go('conv');
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
